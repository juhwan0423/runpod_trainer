dtype: bfloat16
attn_implementation: sdpa
trust_remote_code: false

# Verified live 2026-08-22 (scripts/verify_internvla_n1_module_names.py) --
# do NOT hand-edit these without re-running that script first. Real
# top-level prefixes on the raw InternVLAN1ForCausalLM are `visual.*`,
# `model.layers.*`, `lm_head.*` -- but models/registry.py's
# InternVLAN1UnifiedAdapter.load() returns an InternVLAN1TextWrapper that
# stores the raw model as `self.backbone`, so every prefix below is
# `backbone.<real name>`. System-1 (dual-system diffusion trajectory) heads
# are frozen/unused for this text-only SFT recipe -- config.system1 ==
# "nextdit_async" on this checkpoint, so all of them are real, instantiated
# submodules, not absent.
freeze_prefixes:
  - backbone.visual
  - backbone.model.latent_queries
  - backbone.model.traj_dit
  - backbone.model.action_encoder
  - backbone.model.action_decoder
  - backbone.model.cond_projector
  - backbone.model.memory_encoder
  - backbone.model.rgb_resampler
  - backbone.model.rgb_model

full_text_backbone_freeze_prefixes:
  - backbone.visual
  - backbone.model.latent_queries
  - backbone.model.traj_dit
  - backbone.model.action_encoder
  - backbone.model.action_decoder
  - backbone.model.cond_projector
  - backbone.model.memory_encoder
  - backbone.model.rgb_resampler
  - backbone.model.rgb_model

# Anchored on backbone.model.layers. so it cannot accidentally match
# anything under backbone.visual (Qwen2.5-VL's ViT uses fused qkv/proj
# naming anyway, so it wouldn't collide even unanchored -- anchoring is
# belt-and-suspenders consistency with the other adapters in this registry).
target_modules: 'backbone\.model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))'
lora_trainable_path_fragment: backbone.model.layers.

