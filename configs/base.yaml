run:
  seeds: [0, 1, 2]
  output_root: runs
  report_to: none
  project: industsim-quad-ft

data:
  root: data/sft
  # Portable placeholder. RunPod launchers should set SAIE_IMAGE_ROOT to the
  # persistent raw-image root rather than relying on a workstation path.
  image_root: data/raw
  ablation: default
  num_frames: 1
  max_seq_len: 2048
  # Collation invokes the multimodal processor and must stay in the main
  # process; forking after CUDA/ZeRO initialization is unsafe.
  num_workers: 0

train:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch
  bf16: true
  tf32: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
